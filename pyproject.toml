[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-lp-prox"
version = "0.1.0"
description = "GPU-friendly polynomial approximations for nonconvex Lp proximal operators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fast_lp_prox = ["coeff_tables/*.json"]